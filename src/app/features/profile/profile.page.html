<ion-content [fullscreen]="true" class="page-canvas">
  <div class="app-viewport-container">
    
    <div class="profile-hero-card">
      <div class="hero-avatar">
        <span>🏃</span>
      </div>
      <h1 class="hero-name">Corredor(a) CorreJa</h1>
      <span class="hero-level">Plano Ativo: Primeiros 5 km</span>

      <div class="hero-stats-row">
        <div class="hero-stat">
          <span class="val">7.4</span>
          <span class="lbl">km totais</span>
        </div>
        <div class="stat-sep"></div>
        <div class="hero-stat">
          <span class="val">2</span>
          <span class="lbl">semanas</span>
        </div>
        <div class="stat-sep"></div>
        <div class="hero-stat">
          <span class="val">5</span>
          <span class="lbl">treinos</span>
        </div>
      </div>
    </div>

    <div class="settings-group">
      <h2 class="group-title">Minha Jornada</h2>
      <div class="settings-list">
        <div class="setting-item">
          <div class="item-left">
            <ion-icon name="medal-outline"></ion-icon>
            <span>Objetivo Atual: Correr 5 km direto</span>
          </div>
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </div>

        <div class="setting-item">
          <div class="item-left">
            <ion-icon name="ribbon-outline"></ion-icon>
            <span>Conquistas e Medalhas</span>
          </div>
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </div>
      </div>
    </div>

    <div class="settings-group">
      <h2 class="group-title">Configurações & Conexões</h2>
      <div class="settings-list">
        <div class="setting-item">
          <div class="item-left">
            <ion-icon name="notifications-outline"></ion-icon>
            <span>Lembretes de Treino</span>
          </div>
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </div>

        <div class="setting-item">
          <div class="item-left">
            <ion-icon name="shield-checkmark-outline"></ion-icon>
            <span>Integração Strava (Fase 5)</span>
          </div>
          <span class="badge-soon">Em breve</span>
        </div>
      </div>
    </div>

  </div>
</ion-content>
