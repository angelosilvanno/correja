<ion-tabs class="correja-tabs">
  <aside class="desktop-sidebar">
    <div class="sidebar-top">
      <div class="brand-header">
        <div class="brand-logo-icon">
          <span class="stripe s1"></span>
          <span class="stripe s2"></span>
          <span class="stripe s3"></span>
        </div>
        <span class="brand-name">Corre<span class="brand-accent">Ja</span></span>
      </div>

      <nav class="sidebar-nav">
        <a routerLink="/tabs/dashboard" routerLinkActive="active" class="nav-item">
          <ion-icon name="home-outline"></ion-icon>
          <span>Início</span>
        </a>
        <a routerLink="/tabs/plans" routerLinkActive="active" class="nav-item">
          <ion-icon name="document-text-outline"></ion-icon>
          <span>Planos</span>
        </a>
        <a routerLink="/tabs/zones" routerLinkActive="active" class="nav-item">
          <ion-icon name="speedometer-outline"></ion-icon>
          <span>Zonas</span>
        </a>
        <a routerLink="/tabs/profile" routerLinkActive="active" class="nav-item">
          <ion-icon name="person-outline"></ion-icon>
          <span>Perfil</span>
        </a>
      </nav>
    </div>

    <div class="sidebar-bottom">
      <div class="motivation-card">
        <div class="sparkle-badge">
          <ion-icon name="sparkles-outline"></ion-icon>
        </div>
        <h4>Continue firme!</h4>
        <p>Cada treino concluído aproxima você do seu objetivo.</p>
      </div>

      <div class="user-profile-footer" routerLink="/tabs/profile">
        <div class="user-initials-avatar">{{ userInitials }}</div>
        <div class="user-details">
          <strong>{{ fullUserName }}</strong>
          <span>{{ activePlanLabel }}</span>
        </div>
        <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
      </div>
    </div>
  </aside>

  <ion-tab-bar slot="bottom" class="mobile-tab-bar">
    <ion-tab-button tab="dashboard" href="/tabs/dashboard">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Início</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="plans" href="/tabs/plans">
      <ion-icon name="document-text-outline"></ion-icon>
      <ion-label>Planos</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="zones" href="/tabs/zones">
      <ion-icon name="speedometer-outline"></ion-icon>
      <ion-label>Zonas</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profile" href="/tabs/profile">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
